    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            font-size: 14px;
            line-height: 1.2;/*1.2*/

        }

        .topic-container {
            display: flex;
            max-width: 900px;
            width: 100%;
            margin: 30px auto;
            gap: 20px;
            justify-content: space-between;
        }

        .topic-container li {
            height: 250px;
            width: 250px;
            overflow: hidden;
            outline: 1px solid red;
            position: relative;
        }

        .topic-container li:hover .description {
            bottom: 0;
        }

        .topic-container li img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            
        }

        .description {
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            padding: 1.5em;
            text-align: center;
            position: absolute;
            bottom: -65px;
            left: 0;
            right: 0;
            transition:bottom 0.5s;
        }

        .description h3 {
            color: gold;
            margin-bottom: 30px;

        }

    </style>

</head>
