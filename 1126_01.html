<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link ret="stylesheet" href="./css/reset.css">
    <style>
        body {
            background-color: #f3f3f3;
            background-image: url('./images/full_bg.jpg')
        }
       .container {
            width: 300px;
            border: 3px solid #6c6c6c;
            border-radius: 10px;
            padding: 30px 20px;
            margin: 30px;
            box-sizing: border-box;
            background-color: #fff;
            background-image: url('./images/icons/house.svg');
            background-position: right 10px top 10px;
            background-repeat: no-repeat;
            background-size: 34px;
            
        }
        
        .container h1 {
            font-size: 24px;
            font-weight: 600;
            padding-left: 34px;
            background-image: url('./images/icons/cafe.svg');
            background-repeat: no-repeat;
        }
        .container p {
            font-size: 14px;
            line-height: 1.2;
            margin-top: 14px;
        }

    </style>
</head>
<body>
    <article class="container">
        <h1>Card title</h1>
        <p>이 카드는 CSS Box Model을 이해하기 위한 예제입니다.</p>
        <p>margin, padding, border, border-radius, 크기등을 다양하게 조정해보세요</p>
        
    </article>
</body>
</html>
